[project]
name = "tradebot"
version = "0.1.0"
description = "Intraday F&O live trading + decision-support stack (Fyers, Dash)."
requires-python = ">=3.12"
# Runtime deps live in requirements.txt (VM-pinned). Mirrored here for `pip install -e .`.
dependencies = [
    "dash>=4.2.0",
    "dash-bootstrap-components>=2.0.4",
    "plotly>=5.0",
    "Flask>=3.1.3",
    "fyers-apiv3>=3.1.12",
    "pandas>=2.2,<3.1",
    "numpy>=2.2,<2.6",
    "pyarrow>=24.0.0",
    "duckdb>=1.5.3",
    "pandas-ta>=0.4.71b0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "import-linter>=2.0"]

# Flat layout for now (modules live in repo root). As the layer migration (Phases B–E
# of ARCHITECTURE_AUDIT.md) lands, code moves under tradebot/ and this becomes a src pkg.
[tool.setuptools]
py-modules = []   # not yet an installable package; pyproject is the guardrail config home

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", ".venv", "venv", "__pycache__", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # long lines tolerated in dense quant code for now

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

# ---------------------------------------------------------------------------
# Import-linter: the 7-layer law (ARCHITECTURE_AUDIT.md §2). Imports point DOWN only.
# ASPIRATIONAL — this governs only the tradebot/ package (~575 of ~36k LOC); most code is
# still flat in root, so "contract kept" is a TARGET SPEC for the layered lift, not proof
# the real code is clean. The boundaries that actually hold TODAY on the flat modules
# (legacy stays dead · core is a leaf · the live-serve path imports no backtest/audit code)
# are ENFORCED continuously in tests/test_unit_architecture.py. Fold contracts in here as
# modules move under tradebot/ (Phase B onward).
[tool.importlinter]
root_package = "tradebot"

[[tool.importlinter.contracts]]
name = "Layers point downward only"
type = "layers"
layers = [
    "tradebot.app",
    "tradebot.jobs",
    "tradebot.engine",
    "tradebot.signals",
    "tradebot.data",
    "tradebot.storage",
    "tradebot.adapters",
]
